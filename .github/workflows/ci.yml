name: T22 regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t22-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-ci-root-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: t22_app
          MYSQL_USER: t22_app
          MYSQL_PASSWORD: ephemeral-ci-app-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      rabbitmq:
        image: rabbitmq:4.2.5-alpine
        env:
          RABBITMQ_DEFAULT_USER: t22_app
          RABBITMQ_DEFAULT_PASS: ephemeral-ci-mq-only
          RABBITMQ_DEFAULT_VHOST: t22_app
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: backend
    env:
      T22_APP_CONFIG: /tmp/t22-ci-${{ github.run_id }}-${{ github.run_attempt }}.json
      T22_MQ_CONFIG: /tmp/t22-ci-mq-${{ github.run_id }}-${{ github.run_attempt }}.json
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Frontend syntax and guardrail regression
        run: |
          node --check ../frontend/assets/app.js
          node ../frontend/tests/guardrails.test.cjs
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config default-libmysqlclient-dev
          python -m pip install -r requirements.lock
      - name: Load harness timestamp regression
        run: |
          python -m pip install -r ../docs/10_验收证据/19_后端综合验收/检查脚本/18_负载工具依赖.lock
          python ../docs/10_验收证据/19_后端综合验收/检查脚本/17_严格负载时间戳测试.py
          python ../docs/10_验收证据/19_后端综合验收/检查脚本/23_服务器资源与请求对齐测试.py
      - name: Configure isolated CI databases
        run: |
          python - <<'PY'
          import json, os, secrets
          from pathlib import Path
          import MySQLdb
          connection = MySQLdb.connect(host='127.0.0.1', user='root', passwd='ephemeral-ci-root-only')
          with connection.cursor() as cursor:
              cursor.execute("GRANT ALL PRIVILEGES ON t22_app_test.* TO 't22_app'@'%'")
          connection.close()
          Path(os.environ['T22_APP_CONFIG']).write_text(json.dumps({
              'secret_key': secrets.token_urlsafe(48),
              'database': {'HOST': '127.0.0.1', 'PORT': 3306, 'NAME': 't22_app',
                           'USER': 't22_app', 'PASSWORD': 'ephemeral-ci-app-only'}
          }), encoding='utf-8')
          Path(os.environ['T22_MQ_CONFIG']).write_text(json.dumps({
              'host': '127.0.0.1', 'port': 5672, 'virtual_host': 't22_app',
              'user': 't22_app', 'password': 'ephemeral-ci-mq-only', 'queue': 't22.app.ci'
          }), encoding='utf-8')
          PY
      - name: Migrate isolated CI application database
        run: python manage.py migrate --noinput
      - name: Framework and migration checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Formal-load Waitress profile smoke
        run: python ../docs/10_验收证据/19_后端综合验收/检查脚本/20_正式负载服务剖析烟测.py
      - name: Full regression on MySQL and RabbitMQ
        run: python manage.py test tests governance clinic --noinput -v 2
