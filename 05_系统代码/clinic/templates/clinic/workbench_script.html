<script>
const isClinical=$('clinic-root').dataset.role==='doctor';let clinicPage=1,clinicTotal=0,clinicData=null;
const clinicEndpoint=isClinical?'/api/clinical/encounters':'/api/receptions';
async function clinicRefresh(){const result=await api(clinicEndpoint+'?page='+clinicPage);clinicTotal=result.total;$('clinic-count').textContent='共 '+result.total+' 次接诊 · 第 '+clinicPage+' 页';$('clinic-prev').disabled=clinicPage<=1;$('clinic-next').disabled=clinicPage*result.page_size>=result.total;$('clinic-list').replaceChildren();for(const item of result.items){const row=isClinical?item.reception:item;const b=node('button',(row.error_mark?'[误建] ':'')+(row.pet_name||row.species)+' · '+new Date(row.created_at).toLocaleString('zh-CN'));b.className='item';b.onclick=()=>clinicOpen(row.encounter_ref).catch(e=>notice(e.message,true));$('clinic-list').append(b);}}
function textField(parent,title,value){parent.append(node('h3',title));const p=node('p',value||'未填写');p.className='clinic-copy';parent.append(p);}
async function clinicOpen(ref){const result=await api(clinicEndpoint+'/'+ref);clinicRender(result);}
function clinicRender(result){clinicData=result;const row=isClinical?result.reception:result,d=$('clinic-detail');d.replaceChildren(node('h2',(row.pet_name||row.species)+' · 本次接诊'));const meta=node('p','接诊编号：'+row.encounter_ref+'\n宠物编号：'+row.pet_ref+'\n接待账号：'+row.receptionist_ref+' · 接诊医生：'+row.doctor_ref+'\n时间：'+new Date(row.created_at).toLocaleString('zh-CN'));meta.className='clinic-meta clinic-copy';d.append(meta);if(row.error_mark){const mark=node('p','已标记误建 · '+row.error_reason);mark.className='alert-mark';d.append(mark);}textField(d,'种类',row.species);textField(d,'本次主诉',row.complaint);
if(isClinical){const clinical=result.clinical;if(!clinical){d.append(node('h3','尚无正式病历'));}else{d.append(node('p','病历编号：'+clinical.record_ref+' · 原模板版本：'+clinical.template_version_ref));textField(d,'诊断说明',clinical.diagnosis);textField(d,'检查说明',clinical.examination);const history=node('details');history.append(node('summary','诊疗版本记录'));for(const r of clinical.clinical_versions){const entry=node('p','版本 '+r.version+' · 医生账号 '+r.actor_ref+'\n'+r.diagnosis+'\n'+r.examination+(r.reason?'\n更正理由：'+r.reason:''));entry.className='history-entry';history.append(entry);}d.append(history);}}
if(isClinical)doctorEditor(d,result);
const versions=node('details');versions.append(node('summary','接待资料更正历史'));for(const r of row.reception_versions){const entry=node('p','版本 '+r.version+' · 账号 '+r.actor_ref+' · '+new Date(r.created_at).toLocaleString('zh-CN')+'\n'+r.species+' / '+(r.pet_name||'未填写称呼')+'\n'+r.complaint+(r.reason?'\n理由：'+r.reason:''));entry.className='history-entry';versions.append(entry);}d.append(versions);
if(!isClinical){const form=node('form');form.append(node('h3','更正接待资料'));for(const [id,label,value,max] of [['correct-species','种类',row.species,100],['correct-name','称呼',row.pet_name,100],['correct-complaint','主诉',row.complaint,10000],['correct-reason','更正理由','',2000]]){const l=node('label',label);l.htmlFor=id;const input=node(max>100?'textarea':'input');input.id=id;input.value=value;input.maxLength=max;input.required=id!=='correct-name';form.append(l,input);}const save=node('button','保存更正');form.append(save);form.onsubmit=async event=>{event.preventDefault();save.disabled=true;try{const latest=row.reception_versions[row.reception_versions.length-1];const saved=await api('/api/encounters/'+row.encounter_ref+'/corrections',{species:$('correct-species').value,pet_name:$('correct-name').value,complaint:$('correct-complaint').value,original_version_ref:latest.version_ref,reason:$('correct-reason').value});notice('更正已保存，原资料和归属保留。');clinicRender(saved);await clinicRefresh();}catch(e){notice(e.message,true);}finally{save.disabled=false;}};d.append(form);if(!row.error_mark){const label=node('label','误建理由');label.htmlFor='mark-reason';const reason=node('textarea');reason.id='mark-reason';reason.maxLength=2000;const mark=node('button','标记误建');mark.className='danger';mark.onclick=async()=>{mark.disabled=true;try{const saved=await api('/api/encounters/'+row.encounter_ref+'/misregistration',{reason:reason.value});notice('已标记误建，资料及历史保留。');clinicRender(saved);await clinicRefresh();}catch(e){notice(e.message,true);}finally{mark.disabled=false;}};d.append(node('h3','误建处理'),label,reason,mark);}}}
button('clinic-refresh',clinicRefresh);async function clinicTurn(delta){const old=clinicPage;clinicPage+=delta;$('clinic-prev').disabled=true;$('clinic-next').disabled=true;try{await clinicRefresh();}catch(e){clinicPage=old;notice(e.message,true);}finally{$('clinic-prev').disabled=clinicPage<=1;$('clinic-next').disabled=clinicPage*50>=clinicTotal;}}$('clinic-prev').onclick=()=>clinicTurn(-1);$('clinic-next').onclick=()=>clinicTurn(1);
if(!isClinical){$('pet-ref').value=crypto.randomUUID();button('new-pet-ref',async()=>{$('pet-choice').value='new';$('pet-ref').value=crypto.randomUUID();});button('check-pet-ref',async()=>{const r=await api('/api/encounters/create-options/pet-reference-check',{pet_ref:$('pet-ref').value});notice(r.associable?'该编号可关联本次接诊；不会带入其他接诊资料。':'该编号不能作为本店已知编号关联。',!r.associable);});$('reception-create').onsubmit=async event=>{event.preventDefault();$('create-encounter').disabled=true;try{const result=await api('/api/encounters',{pet_identity_choice:$('pet-choice').value,pet_ref:$('pet-ref').value,species:$('pet-species').value,complaint:$('pet-complaint').value,pet_name:$('pet-name').value,doctor_ref:Number($('doctor-ref').value)});notice('接诊已保存，接待及接诊归属已固定。');clinicRender(result);clinicPage=1;await clinicRefresh();}catch(e){notice(e.message,true);}finally{$('create-encounter').disabled=false;}};(async()=>{try{const result=await api('/api/encounters/create-options/doctors');$('doctor-ref').replaceChildren(node('option','请选择接诊医生'));$('doctor-ref').firstChild.value='';for(const doctor of result.doctor_options){const option=node('option',doctor.display_name);option.value=doctor.doctor_ref;$('doctor-ref').append(option);}}catch(e){notice(e.message,true);}})();}
clinicRefresh().catch(e=>notice(e.message,true));
</script>
