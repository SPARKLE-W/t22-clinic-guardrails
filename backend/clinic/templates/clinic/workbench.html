<div id="clinic-root" data-role="{{ user.role }}" class="grid">
<aside>
{% if user.role == 'frontdesk' %}<form id="reception-create" class="card"><h2>接诊建档</h2><label for="pet-choice">宠物编号</label><select id="pet-choice"><option value="new">登记新编号</option><option value="known">关联本店已知编号</option></select><input id="pet-ref" required aria-label="宠物编号" placeholder="宠物编号"><button type="button" id="new-pet-ref" class="secondary">生成新编号</button><button type="button" id="check-pet-ref" class="secondary">核验已知编号</button><label for="pet-species">种类</label><input id="pet-species" required maxlength="100" placeholder="如：猫、犬"><label for="pet-name">称呼（可选）</label><input id="pet-name" maxlength="100"><label for="pet-complaint">本次主诉</label><textarea id="pet-complaint" required maxlength="10000"></textarea><label for="doctor-ref">接诊医生</label><select id="doctor-ref" required><option value="">正在获取本店医生…</option></select><button id="create-encounter">保存接诊</button></form>{% endif %}
<section class="card"><h2>{% if user.role == 'doctor' %}负责接诊的记录{% else %}接待记录{% endif %}</h2><button id="clinic-refresh" class="secondary">刷新</button><p id="clinic-count" class="muted"></p><div id="clinic-list"></div><button id="clinic-prev" class="secondary">上一页</button><button id="clinic-next" class="secondary">下一页</button></section>{% if user.role == 'doctor' %}<section class="card"><h2>我的护栏告警</h2><button id="alert-refresh" class="secondary">刷新告警</button><p id="alert-count" class="alert-mark" aria-live="polite"></p><div id="doctor-alerts"></div></section>{% endif %}</aside>
<section class="card" id="clinic-detail"><h2>接诊资料</h2><p class="muted">选择左侧记录查看本次接诊资料。</p></section></div>
<style>select{width:100%;padding:10px;border:1px solid #afbfba;border-radius:5px;font:inherit;background:white}.clinic-meta{overflow-wrap:anywhere}.history-entry{border-left:3px solid #c6d7cd;padding:8px 14px;margin:12px 0;white-space:pre-wrap}.alert-mark{color:#9c382a;font-weight:bold}.clinic-copy{white-space:pre-wrap;word-break:break-word}</style>
